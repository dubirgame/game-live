<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Taxta teksturası üçün gradient - qırmızımtıl mahogany -->
    <linearGradient id="woodGrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B3D2E"/>
      <stop offset="25%" style="stop-color:#7A4A38"/>
      <stop offset="50%" style="stop-color:#6B3D2E"/>
      <stop offset="75%" style="stop-color:#8B5A45"/>
      <stop offset="100%" style="stop-color:#6B3D2E"/>
    </linearGradient>

    <!-- Tünd taxta (çərçivə) - qırmızımtıl tünd mahogany -->
    <linearGradient id="darkWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A2C20"/>
      <stop offset="50%" style="stop-color:#5C3828"/>
      <stop offset="100%" style="stop-color:#4A2C20"/>
    </linearGradient>

    <!-- Açıq üçbucaq - lovhe6 krem -->
    <linearGradient id="lightTriangle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D0"/>
      <stop offset="100%" style="stop-color:#E8D4B8"/>
    </linearGradient>

    <!-- Tünd üçbucaq - lovhe6 qəhvəyi -->
    <linearGradient id="darkTriangle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A67B5B"/>
      <stop offset="100%" style="stop-color:#8B6347"/>
    </linearGradient>

    <!-- Vurulmuş daşlar sahəsi üçün gradient - tünd mahogany -->
    <linearGradient id="capturedArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3A231A"/>
      <stop offset="100%" style="stop-color:#4A2C20"/>
    </linearGradient>

    <!-- Kölgə effekti -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>

    <!-- İç kölgə -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Əsas çərçivə (xarici) -->
  <rect x="0" y="0" width="1500" height="800" rx="20" ry="20" fill="url(#darkWood)" filter="url(#dropShadow)"/>

  <!-- İç çərçivə -->
  <rect x="15" y="15" width="1470" height="770" rx="15" ry="15" fill="url(#woodGrain)"/>

  <!-- Sol kənar - Vurulmuş daşlar sahəsi (120px) - 15%/85% bölünmüş -->
  <!-- Sol yuxarı hissə (15% = 111px) - Initial dice sol -->
  <rect id="sidebar-left-top" x="30" y="30" width="120" height="107" rx="8" ry="8" fill="url(#capturedArea)" filter="url(#innerShadow)"/>
  <!-- Sol divider - mahogany -->
  <rect x="30" y="137" width="120" height="4" fill="#5C3828"/>
  <!-- Sol aşağı hissə (85% = 629px) -->
  <rect x="30" y="141" width="120" height="629" rx="8" ry="8" fill="url(#capturedArea)" filter="url(#innerShadow)"/>

  <!-- Sağ kənar - Vurulmuş daşlar sahəsi (120px) - 15%/85% bölünmüş -->
  <!-- Sağ yuxarı hissə (15% = 111px) - Initial dice sağ -->
  <rect id="sidebar-right-top" x="1350" y="30" width="120" height="107" rx="8" ry="8" fill="url(#capturedArea)" filter="url(#innerShadow)"/>
  <!-- Sağ divider - mahogany -->
  <rect x="1350" y="137" width="120" height="4" fill="#5C3828"/>
  <!-- Sağ aşağı hissə (85% = 629px) -->
  <rect x="1350" y="141" width="120" height="629" rx="8" ry="8" fill="url(#capturedArea)" filter="url(#innerShadow)"/>

  <!-- Oyun sahəsi (sol tərəf) - lovhe6 açıq krem fon -->
  <rect x="160" y="30" width="570" height="740" rx="10" ry="10" fill="#D4C4A8" filter="url(#innerShadow)"/>

  <!-- Oyun sahəsi (sağ tərəf) - lovhe6 açıq krem fon -->
  <rect x="770" y="30" width="570" height="740" rx="10" ry="10" fill="#D4C4A8" filter="url(#innerShadow)"/>

  <!-- Orta bar (separator) - mahogany -->
  <rect x="730" y="15" width="40" height="770" fill="url(#darkWood)"/>
  <rect x="735" y="20" width="30" height="760" rx="5" ry="5" fill="#5C3828"/>

  <!-- Sol tərəf - Yuxarı üçbucaqlar (6 ədəd) -->
  <g id="topLeftTriangles">
    <polygon points="170,40 260,40 215,340" fill="url(#darkTriangle)"/>
    <polygon points="265,40 355,40 310,340" fill="url(#lightTriangle)"/>
    <polygon points="360,40 450,40 405,340" fill="url(#darkTriangle)"/>
    <polygon points="455,40 545,40 500,340" fill="url(#lightTriangle)"/>
    <polygon points="550,40 640,40 595,340" fill="url(#darkTriangle)"/>
    <polygon points="645,40 720,40 682.5,340" fill="url(#lightTriangle)"/>
  </g>

  <!-- Sol tərəf - Aşağı üçbucaqlar (6 ədəd) -->
  <g id="bottomLeftTriangles">
    <polygon points="170,760 260,760 215,460" fill="url(#lightTriangle)"/>
    <polygon points="265,760 355,760 310,460" fill="url(#darkTriangle)"/>
    <polygon points="360,760 450,760 405,460" fill="url(#lightTriangle)"/>
    <polygon points="455,760 545,760 500,460" fill="url(#darkTriangle)"/>
    <polygon points="550,760 640,760 595,460" fill="url(#lightTriangle)"/>
    <polygon points="645,760 720,760 682.5,460" fill="url(#darkTriangle)"/>
  </g>

  <!-- Sağ tərəf - Yuxarı üçbucaqlar (6 ədəd) -->
  <g id="topRightTriangles">
    <polygon points="780,40 870,40 825,340" fill="url(#lightTriangle)"/>
    <polygon points="875,40 965,40 920,340" fill="url(#darkTriangle)"/>
    <polygon points="970,40 1060,40 1015,340" fill="url(#lightTriangle)"/>
    <polygon points="1065,40 1155,40 1110,340" fill="url(#darkTriangle)"/>
    <polygon points="1160,40 1250,40 1205,340" fill="url(#lightTriangle)"/>
    <polygon points="1255,40 1330,40 1292.5,340" fill="url(#darkTriangle)"/>
  </g>

  <!-- Sağ tərəf - Aşağı üçbucaqlar (6 ədəd) -->
  <g id="bottomRightTriangles">
    <polygon points="780,760 870,760 825,460" fill="url(#darkTriangle)"/>
    <polygon points="875,760 965,760 920,460" fill="url(#lightTriangle)"/>
    <polygon points="970,760 1060,760 1015,460" fill="url(#darkTriangle)"/>
    <polygon points="1065,760 1155,760 1110,460" fill="url(#lightTriangle)"/>
    <polygon points="1160,760 1250,760 1205,460" fill="url(#darkTriangle)"/>
    <polygon points="1255,760 1330,760 1292.5,460" fill="url(#lightTriangle)"/>
  </g>

  <!-- Dekorativ xətlər (çərçivə daxilində) - mahogany -->
  <rect x="25" y="25" width="1450" height="750" rx="12" ry="12" fill="none" stroke="#5C3828" stroke-width="2"/>

  <!-- İncə daxili xətt - mahogany -->
  <rect x="28" y="28" width="1444" height="744" rx="10" ry="10" fill="none" stroke="#7A4A38" stroke-width="1" opacity="0.5"/>

  <!-- Gizli markerlar - 24 üçbucağın təban xəttinin orta nöqtəsi -->
  <g id="point-markers" opacity="0">
    <!-- Yuxarı sol (13-18): points="x1,40 x2,40 center,340" -> orta=(x1+x2)/2, y=40 -->
    <circle id="marker-13" cx="215" cy="40" r="5"/>   <!-- (170+260)/2=215 -->
    <circle id="marker-14" cx="310" cy="40" r="5"/>   <!-- (265+355)/2=310 -->
    <circle id="marker-15" cx="405" cy="40" r="5"/>   <!-- (360+450)/2=405 -->
    <circle id="marker-16" cx="500" cy="40" r="5"/>   <!-- (455+545)/2=500 -->
    <circle id="marker-17" cx="595" cy="40" r="5"/>   <!-- (550+640)/2=595 -->
    <circle id="marker-18" cx="682.5" cy="40" r="5"/> <!-- (645+720)/2=682.5 -->

    <!-- Yuxarı sağ (19-24): points="x1,40 x2,40 center,340" -> orta=(x1+x2)/2, y=40 -->
    <circle id="marker-19" cx="825" cy="40" r="5"/>   <!-- (780+870)/2=825 -->
    <circle id="marker-20" cx="920" cy="40" r="5"/>   <!-- (875+965)/2=920 -->
    <circle id="marker-21" cx="1015" cy="40" r="5"/>  <!-- (970+1060)/2=1015 -->
    <circle id="marker-22" cx="1110" cy="40" r="5"/>  <!-- (1065+1155)/2=1110 -->
    <circle id="marker-23" cx="1205" cy="40" r="5"/>  <!-- (1160+1250)/2=1205 -->
    <circle id="marker-24" cx="1292.5" cy="40" r="5"/><!-- (1255+1330)/2=1292.5 -->

    <!-- Aşağı sol (12-7): points="x1,760 x2,760 center,460" -> orta=(x1+x2)/2, y=760 -->
    <circle id="marker-12" cx="215" cy="760" r="5"/>  <!-- (170+260)/2=215 -->
    <circle id="marker-11" cx="310" cy="760" r="5"/>  <!-- (265+355)/2=310 -->
    <circle id="marker-10" cx="405" cy="760" r="5"/>  <!-- (360+450)/2=405 -->
    <circle id="marker-9" cx="500" cy="760" r="5"/>   <!-- (455+545)/2=500 -->
    <circle id="marker-8" cx="595" cy="760" r="5"/>   <!-- (550+640)/2=595 -->
    <circle id="marker-7" cx="682.5" cy="760" r="5"/> <!-- (645+720)/2=682.5 -->

    <!-- Aşağı sağ (6-1): points="x1,760 x2,760 center,460" -> orta=(x1+x2)/2, y=760 -->
    <circle id="marker-6" cx="825" cy="760" r="5"/>   <!-- (780+870)/2=825 -->
    <circle id="marker-5" cx="920" cy="760" r="5"/>   <!-- (875+965)/2=920 -->
    <circle id="marker-4" cx="1015" cy="760" r="5"/>  <!-- (970+1060)/2=1015 -->
    <circle id="marker-3" cx="1110" cy="760" r="5"/>  <!-- (1065+1155)/2=1110 -->
    <circle id="marker-2" cx="1205" cy="760" r="5"/>  <!-- (1160+1250)/2=1205 -->
    <circle id="marker-1" cx="1292.5" cy="760" r="5"/><!-- (1255+1330)/2=1292.5 -->
  </g>
</svg>